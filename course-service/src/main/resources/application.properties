spring.application.name=course-service

server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/learnify_english?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Uploads (PDF du cours pour le RAG)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Gemini (RAG "Ask the course") - ne jamais committer la cle : variable d'environnement GEMINI_API_KEY
# ou fichier course-service/.env (ignore par git, voir .env.example), charge si le service est lance depuis ce dossier
spring.config.import=optional:file:.env[.properties],optional:file:course-service/.env[.properties]
course.ai.api-key=${GEMINI_API_KEY:}
# Cle dediee au generateur de quiz par lecon (quota separe) ; si vide, la cle principale est utilisee
course.ai.quiz-api-key=${GEMINI_QUIZ_API_KEY:}
course.ai.base-url=https://generativelanguage.googleapis.com/v1beta
course.ai.chat-model=${GEMINI_MODEL:gemini-2.5-flash}
course.ai.transcription-model=${GEMINI_TRANSCRIPTION_MODEL:gemini-2.5-flash}
course.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
course.ai.embedding-dimension=768
course.ai.max-retries=3

# RAG - ingestion
course.rag.chunk-target-chars=1000
course.rag.embedding-batch-size=50
course.rag.transcription-window-minutes=10
course.rag.storage-dir=uploads/course-documents
# Reindexation automatique d'un cours quand une lecon, un module ou le cours est modifie
course.rag.auto-reindex=true

# RAG - retrieval
course.rag.top-k=5
course.rag.min-score=0.55
course.rag.current-lesson-boost=0.05

# RAG - generateur de quiz : nombre max de passages, et compromis MMR pertinence (1.0) / diversite (0.0)
course.rag.quiz-max-passages=15
course.rag.quiz-mmr-lambda=0.5

# RAG - acces etudiants : false = tout etudiant connecte peut poser des questions (pas de verification de paiement)
course.rag.require-enrollment=false
# limite de questions par utilisateur
course.rag.rate-limit-per-minute=5
course.rag.rate-limit-per-day=50

# Securite : JWT emis par user-service. JWT_SECRET doit avoir la MEME valeur que jwt.secret du user-service
# (variable d'environnement ou fichier .env local, voir .env.example).
jwt.secret=${JWT_SECRET:learnifySecretKeyUltraLongueEtTresSecurisee!}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
