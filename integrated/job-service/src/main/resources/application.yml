server:
  port: 8088
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: job-service

  # Local MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/job_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

file:
  upload-dir: uploads

jwt:
  secret: learnifySecretKeyUltraLongueEtTresSecurisee!

# Eureka pointing to localhost
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

rag:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:mistral}

ocr:
  tesseract:
    path: ${TESSERACT_PATH:tesseract}

whisper:
  python:
    path: python
  model: base

groq:
  api-key: ${GROQ_API_KEY:${GROQ_API_KEY}}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  fallback-model: openai/gpt-oss-20b
  url: https://api.groq.com/openai/v1/chat/completions


